<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Info 导航管理端" />
    <title>Info · 导航管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="admin-page">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-brand" href="./index.html">
          <span class="brand-glyph">i</span>
          <span><b>INFO</b><small>导航管理台</small></span>
        </a>
        <nav class="admin-primary-nav" aria-label="管理导航">
          <button class="admin-nav-item is-active" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
            导航内容
          </button>
        </nav>
        <div class="admin-sidebar-bottom">
          <a class="admin-nav-item" href="./index.html">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M14 5h5v5"/><path d="m19 5-8 8"/><path d="M17 13v6H5V7h6"/></svg>
            查看用户页
          </a>
          <button id="logout-button" class="admin-nav-item" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 5H5v14h5"/><path d="M14 8l4 4-4 4M18 12H9"/></svg>
            退出登录
          </button>
          <p>所有更改会安全保存到服务器</p>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <div>
            <p class="eyebrow">CONTENT CONTROL</p>
            <h1>导航内容</h1>
          </div>
          <div class="admin-actions">
            <button id="import-button" class="secondary-button" type="button">导入</button>
            <input id="import-file" type="file" accept="application/json" hidden />
            <button id="export-button" class="secondary-button" type="button">导出</button>
            <a class="primary-button" href="./index.html" target="_blank">预览用户页</a>
          </div>
        </header>

        <section class="admin-overview" aria-label="内容概览">
          <div class="overview-copy">
            <p>内容结构</p>
            <h2>先选择分组，再维护其中的卡片和链接。</h2>
          </div>
          <dl id="admin-stats" class="stats-row"></dl>
        </section>

        <div class="admin-workspace">
          <aside class="group-panel">
            <div class="panel-heading">
              <div><span>分组</span><small id="group-count">0 个</small></div>
              <button id="add-group-button" class="icon-button" type="button" aria-label="新增分组" title="新增分组">+</button>
            </div>
            <div id="admin-group-list" class="admin-group-list"></div>
          </aside>

          <section class="content-panel">
            <div id="selected-group-header" class="selected-group-header"></div>
            <div id="admin-card-list" class="admin-card-list"></div>
          </section>
        </div>
      </main>
    </div>

    <dialog id="editor-dialog" class="editor-dialog">
      <form id="editor-form" method="dialog">
        <div class="dialog-heading">
          <div><p id="dialog-eyebrow" class="eyebrow"></p><h2 id="dialog-title"></h2></div>
          <button class="dialog-close" aria-label="关闭" type="button" data-dialog-close>×</button>
        </div>
        <div id="dialog-fields" class="dialog-fields"></div>
        <div class="dialog-actions">
          <button class="secondary-button" type="button" data-dialog-close>取消</button>
          <button id="dialog-submit" class="primary-button" value="default" type="submit">保存</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./src/admin.js"></script>
  </body>
</html>
